<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renovation Hatsady – Option 2</title>
<style>
:root{--bg:#f4f2ee;--panel:rgba(255,255,255,.92);--ink:#1f2326;--mute:#6b7075;--line:#e1ded7;--acc:#1d1f21;--accTxt:#fff;--hl:#b8894f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI","Leelawadee UI","Phetsarath OT","Noto Sans Lao",system-ui,-apple-system,sans-serif;overflow:hidden}
#view{position:fixed;inset:0}
#view canvas{display:block;touch-action:none}
header{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5;flex-wrap:wrap}
header>*{pointer-events:auto}
.brand{background:var(--panel);backdrop-filter:blur(8px);border-radius:12px;padding:8px 14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand span{color:var(--mute);font-size:11.5px}
.seg{display:flex;background:var(--panel);backdrop-filter:blur(8px);border-radius:12px;padding:4px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.seg button,.chips button{border:0;background:transparent;font:inherit;color:var(--ink);padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--accTxt)}
.seg.big button{font-weight:600;padding:8px 16px}
.spacer{flex:1}
#panel{position:fixed;top:78px;left:12px;bottom:12px;width:276px;background:var(--panel);backdrop-filter:blur(8px);border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.1);overflow:auto;padding:4px 14px 14px;z-index:4;transition:transform .25s}
body.collapsed #panel{transform:translateX(-300px)}
#panel h4{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{background:#efede8;padding:5px 10px;font-size:12px}
.chips button.on{background:var(--acc);color:#fff}
label.ck{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
label.ck input{accent-color:#1d1f21;width:15px;height:15px}
#cutrow{display:flex;gap:8px;align-items:center;margin-top:8px}
#cutrow input{flex:1;accent-color:#1d1f21}
#notes{font-size:12.5px;color:#33383c}
#notes p{margin:0 0 6px}
#notes ul{margin:0;padding-left:17px}
#notes li{margin:3px 0}
#legend{position:fixed;right:12px;bottom:12px;background:var(--panel);border-radius:12px;padding:8px 12px;display:flex;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.08);z-index:4;max-width:calc(100% - 24px)}
#legend span{display:flex;align-items:center;gap:6px;font-size:12px}
#legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;color:#fff;background:rgba(20,22,24,.55);padding:5px 12px;border-radius:20px;font-size:11.5px;z-index:3;pointer-events:none;white-space:nowrap}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.pin{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:600;color:#1f2326;background:rgba(255,255,255,.93);padding:3px 9px 3px 8px;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.18);margin:-26px 0 0 -8px}
.pin:after{content:"";position:absolute;left:4px;bottom:-9px;width:8px;height:8px;border-radius:50%;background:var(--hl);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.mlabel{position:absolute;left:0;top:0;display:none;background:#ff5a1f;color:#fff;font-weight:700;padding:4px 10px;border-radius:8px;margin:-34px 0 0 -30px;text-align:center}
.mlabel small{display:block;font-weight:400;font-size:10.5px;opacity:.9}
#tip{position:fixed;display:none;background:#1f2326;color:#fff;font-size:12px;padding:4px 9px;border-radius:6px;z-index:9;pointer-events:none}
#panelToggle{width:38px;height:38px;border-radius:10px;border:0;background:var(--panel);box-shadow:0 2px 12px rgba(0,0,0,.08);cursor:pointer;font-size:18px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font:inherit;cursor:pointer}
.tools button.on{background:#ff5a1f;color:#fff;border-color:#ff5a1f}
#splash{position:fixed;inset:0;background:#f4f2ee;display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity .6s;font-size:15px;color:#555}
#splash.gone{opacity:0;pointer-events:none}
@media (max-width:760px){
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46vh;border-radius:14px 14px 0 0}
  body.collapsed #panel{transform:translateY(110%)}
  .brand span{display:none}
  .seg button{padding:7px 9px}
  #hint,#legend{display:none}
}
#walkui,#walkpad{display:none}
body.walking #walkui{display:flex;position:fixed;top:78px;left:50%;transform:translateX(-50%);gap:10px;align-items:center;background:rgba(20,22,24,.62);color:#fff;border-radius:20px;padding:6px 8px 6px 14px;z-index:6;font-size:12px;max-width:calc(100% - 24px)}
body.walking #walkui button{border:0;border-radius:14px;padding:5px 12px;background:#fff;color:#1d1f21;font:inherit;cursor:pointer;white-space:nowrap}
body.walking #walkpad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;position:fixed;right:16px;bottom:64px;z-index:6}
#walkpad button{height:52px;border:0;border-radius:12px;background:rgba(255,255,255,.85);font-size:18px;touch-action:none;user-select:none;cursor:pointer}
#walkpad button:active{background:#1d1f21;color:#fff}
body.walking #hint,body.walking #legend{display:none}
</style>
</head>
<body>
<div id="splash">Loading 3D model…</div>
<div id="view"></div>
<div id="labels"></div>
<div id="tip"></div>
<header>
  <button id="panelToggle" title="Menu">☰</button>
  <div class="brand"><b data-t="title"></b><span data-t="subtitle"></span></div>
  <div class="seg big">
    <button data-mode="existing" data-t="m_existing"></button>
    <button data-mode="demolition" data-t="m_demolition"></button>
    <button data-mode="renovation" data-t="m_renovation"></button>
  </div>
  <div class="spacer"></div>
  <div class="seg"><button data-lang="en">EN</button><button data-lang="lo">ລາວ</button></div>
</header>
<aside id="panel">
  <h4 data-t="h_views"></h4>
  <div class="chips">
    <button data-view="aerial" data-t="v_aerial"></button>
    <button data-view="front" data-t="v_front"></button>
    <button data-view="court" data-t="v_court"></button>
    <button data-view="void" data-t="v_void"></button>
    <button data-view="stair" data-t="v_stair"></button>
    <button data-view="side" data-t="v_side"></button>
    <button data-view="top" data-t="v_top"></button>
    <button data-view="back" data-t="v_back"></button>
    <button data-view="plan0" data-t="v_plan0"></button>
    <button data-view="plan1" data-t="v_plan1"></button>
    <button data-view="plan2" data-t="v_plan2"></button>
  </div>
  <h4 data-t="h_walk"></h4>
  <div class="chips">
    <button id="walkBtn" data-t="w_walk"></button>
    <button data-night="0" class="on" data-t="l_day"></button><button data-night="1" data-t="l_night"></button>
    <button id="doorsOpen" data-t="d_open"></button><button id="doorsClose" data-t="d_close"></button>
  </div>
  <h4 data-t="h_floors"></h4>
  <div class="chips">
    <button data-lvl="0" data-t="f_0"></button><button data-lvl="1" data-t="f_1"></button><button data-lvl="2" data-t="f_2"></button><button data-lvl="3" data-t="f_3"></button>
  </div>
  <h4 data-t="h_section"></h4>
  <div class="chips">
    <button data-sec="off" data-t="s_off"></button><button data-sec="long" data-t="s_long"></button><button data-sec="cross" data-t="s_cross"></button><button data-sec="plan" data-t="s_plan"></button>
  </div>
  <div id="cutrow"><span data-t="s_pos"></span><input id="cut" type="range" min="0" max="100" value="50"></div>
  <h4 data-t="h_layers"></h4>
  <label class="ck"><input type="checkbox" data-layer="structure"><span data-t="ly_structure"></span></label>
  <label class="ck"><input type="checkbox" data-layer="walls"><span data-t="ly_walls"></span></label>
  <label class="ck"><input type="checkbox" data-layer="stair"><span data-t="ly_stair"></span></label>
  <label class="ck"><input type="checkbox" data-layer="newstair"><span data-t="ly_newstair"></span></label>
  <label class="ck"><input type="checkbox" data-layer="facade"><span data-t="ly_facade"></span></label>
  <label class="ck"><input type="checkbox" data-layer="landscape"><span data-t="ly_landscape"></span></label>
  <label class="ck"><input type="checkbox" data-layer="interior"><span data-t="ly_interior"></span></label>
  <label class="ck"><input type="checkbox" data-layer="context"><span data-t="ly_context"></span></label>
  <h4 data-t="h_tools"></h4>
  <div class="tools">
    <button id="measure" data-t="t_measure"></button>
    <button id="shot" data-t="t_shot"></button>
    <label class="ck"><input id="lbl" type="checkbox" checked><span data-t="t_labels"></span></label>
  </div>
  <h4 data-t="h_notes"></h4>
  <div id="notes"></div>
</aside>
<div id="legend"></div>
<div id="hint" data-t="hint"></div>
<div id="walkui"><div id="walkInfo"></div><button id="walkExit" data-t="w_exit"></button></div>
<div id="walkpad"><button data-k="tl">&#8630;</button><button data-k="w">&#9650;</button><button data-k="tr">&#8631;</button><button data-k="a">&#9664;</button><button data-k="s">&#9660;</button><button data-k="d">&#9654;</button></div>
